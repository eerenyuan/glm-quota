<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM Quota</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1120;--card:#151d30;--border:#1e2d4a;
  --text:#e2e8f0;--dim:#64748b;
  --green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--blue:#3b82f6;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:32px 16px;
}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.header .sub{font-size:12px;color:var(--dim);margin-top:4px}
.badge{
  display:inline-block;background:var(--blue);color:#fff;
  padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;vertical-align:middle;margin-left:6px;
}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:820px;width:100%}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px 20px 20px;width:240px;display:flex;flex-direction:column;align-items:center;
  position:relative;overflow:hidden;transition:border-color .3s;
}
.card:hover{border-color:rgba(255,255,255,.12)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:16px 16px 0 0;opacity:.8;
}
.card.c-green::before{background:var(--green)}
.card.c-yellow::before{background:var(--yellow)}
.card.c-orange::before{background:var(--orange)}
.card.c-red::before{background:var(--red)}
.card-title{font-size:13px;color:var(--dim);font-weight:500;margin-bottom:16px}
.ring-wrap{position:relative;width:120px;height:120px;margin-bottom:14px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8}
.ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease,stroke .5s}
.ring-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
}
.ring-pct{font-size:28px;font-weight:700;line-height:1}
.ring-label{font-size:11px;color:var(--dim);margin-top:2px}
.info{text-align:center;width:100%}
.info-detail{font-size:12px;color:var(--dim);margin-bottom:6px}
.countdown{
  font-size:12px;color:var(--dim);
  background:rgba(255,255,255,.04);border-radius:8px;padding:6px 12px;
  margin-top:10px;display:inline-block;
}
.countdown .cd-val{color:var(--text);font-weight:500}

/* MCP card uses bar instead of ring */
.bar-wrap{width:100%;margin-bottom:14px}
.bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bar-num{font-size:28px;font-weight:700}
.bar-total{font-size:13px;color:var(--dim)}
.bar-track{width:100%;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .8s ease,background .5s}
.mcp-list{width:100%;margin-top:8px}
.mcp-item{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0}
.mcp-item span:last-child{color:var(--text);font-weight:500}

.footer{margin-top:28px;display:flex;align-items:center;gap:16px}
.status{font-size:12px;color:var(--dim)}
.status .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-right:4px;vertical-align:middle;
}
.status .dot.err{background:var(--red)}
.icon-btn{
  background:none;border:1px solid var(--border);border-radius:8px;
  color:var(--dim);padding:6px 12px;cursor:pointer;font-size:12px;
  transition:all .2s;
}
.icon-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* Setup */
.setup{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:40px;max-width:400px;width:100%;text-align:center;
}
.setup h2{font-size:18px;margin-bottom:8px}
.setup p{font-size:13px;color:var(--dim);margin-bottom:20px;line-height:1.6}
.setup input{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:14px;outline:none;margin-bottom:12px;
  font-family:monospace;
}
.setup input:focus{border-color:var(--blue)}
.setup button{
  width:100%;padding:10px;border:none;border-radius:10px;
  background:var(--blue);color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;transition:opacity .2s;
}
.setup button:hover{opacity:.85}
.setup .hint{font-size:11px;color:var(--dim);margin-top:12px}
.setup .hint a{color:var(--blue)}

/* Error */
.err-banner{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  border-radius:10px;padding:12px 16px;font-size:13px;color:var(--red);
  max-width:820px;width:100%;margin-bottom:16px;text-align:center;
  display:none;
}

/* Settings modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:28px;max-width:400px;width:90%;
}
.modal h3{font-size:16px;margin-bottom:16px}
.modal label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
.modal input{
  width:100%;padding:8px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:13px;font-family:monospace;outline:none;margin-bottom:12px;
}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.modal button{
  padding:8px 16px;border-radius:8px;border:none;font-size:13px;cursor:pointer;
}
.modal .btn-save{background:var(--blue);color:#fff;font-weight:600}
.modal .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--dim)}

/* Loading shimmer */
@keyframes shimmer{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.loading .ring-pct,.loading .bar-num{animation:shimmer 1.5s infinite}

@media(max-width:780px){
  .cards{flex-direction:column;align-items:center}
  .card{width:100%;max-width:300px}
}
</style>
</head>
<body>

<div id="app"></div>

<!-- Settings Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Settings</h3>
    <label>API Key</label>
    <input id="set-key" type="password" placeholder="Paste your API key">
    <label>Refresh interval (seconds)</label>
    <input id="set-interval" type="number" min="10" max="600" value="30">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const app = $('app');

let refreshMs = 30000;
let timer = null;
let cdTimer = null;
let lastData = null;
let lastFetch = 0;
let error = null;

// ---- Colors ----
function color(pct) {
  if (pct >= 90) return 'var(--red)';
  if (pct >= 70) return 'var(--orange)';
  if (pct >= 45) return 'var(--yellow)';
  return 'var(--green)';
}
function colorCls(pct) {
  if (pct >= 90) return 'c-red';
  if (pct >= 70) return 'c-orange';
  if (pct >= 45) return 'c-yellow';
  return 'c-green';
}

// ---- Countdown ----
function cdText(ms) {
  if (!ms) return '';
  const s = Math.max(0, Math.floor((ms - Date.now()) / 1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

// ---- SVG Ring ----
function ringSVG(pct, sz) {
  const r = 50, sw = 8, c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  const col = color(pct);
  return `<svg viewBox="0 0 120 120">
    <circle class="ring-bg" cx="60" cy="60" r="${r}" stroke-width="${sw}"/>
    <circle class="ring-fg" cx="60" cy="60" r="${r}" stroke="${col}"
      stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

// ---- Render Dashboard ----
function renderDash(d) {
  lastData = d;
  lastFetch = Date.now();
  error = null;
  const lvl = (d.level||'').toUpperCase();

  let cards = '';

  // 5-hour
  if (d.hour5) {
    const p = d.hour5.pct, rem = 100 - p;
    cards += `<div class="card ${colorCls(p)}">
      <div class="card-title">5h Quota</div>
      <div class="ring-wrap">${ringSVG(p)}
        <div class="ring-center">
          <div class="ring-pct" style="color:${color(p)}">${p}%</div>
          <div class="ring-label">used</div>
        </div>
      </div>
      <div class="info">
        <div class="info-detail">${rem}% remaining</div>
        <div class="countdown" data-reset="${d.hour5.reset}">reset <span class="cd-val">${cdText(d.hour5.reset)}</span></div>
      </div>
    </div>`;
  }

  // Weekly
  if (d.week) {
    const p = d.week.pct, rem = 100 - p;
    cards += `<div class="card ${colorCls(p)}">
      <div class="card-title">Weekly Quota</div>
      <div class="ring-wrap">${ringSVG(p)}
        <div class="ring-center">
          <div class="ring-pct" style="color:${color(p)}">${p}%</div>
          <div class="ring-label">used</div>
        </div>
      </div>
      <div class="info">
        <div class="info-detail">${rem}% remaining</div>
        <div class="countdown" data-reset="${d.week.reset}">reset <span class="cd-val">${cdText(d.week.reset)}</span></div>
      </div>
    </div>`;
  }

  // MCP
  if (d.mcp) {
    const p = d.mcp.pct;
    const col = color(p), cls = colorCls(p);
    let details = '';
    if (d.mcp.details && d.mcp.details.length) {
      details = '<div class="mcp-list">' + d.mcp.details
        .filter(x => x.usage > 0)
        .map(x => `<div class="mcp-item"><span>${x.modelCode}</span><span>${x.usage}</span></div>`)
        .join('') + '</div>';
    }
    cards += `<div class="card ${cls}">
      <div class="card-title">MCP Monthly</div>
      <div class="bar-wrap">
        <div class="bar-header">
          <span class="bar-num" style="color:${col}">${d.mcp.used}</span>
          <span class="bar-total">/ ${d.mcp.total}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${col}"></div></div>
      </div>
      <div class="info">
        <div class="info-detail">${d.mcp.left} remaining</div>
        ${details}
        <div class="countdown" data-reset="${d.mcp.reset}">reset <span class="cd-val">${cdText(d.mcp.reset)}</span></div>
      </div>
    </div>`;
  }

  const t = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;

  app.innerHTML = `
    <div class="header">
      <h1>GLM Coding Plan <span class="badge">${lvl}</span></h1>
      <div class="sub">Quota Monitor</div>
    </div>
    <div class="err-banner" id="err"></div>
    <div class="cards">${cards}</div>
    <div class="footer">
      <div class="status"><span class="dot"></span>Updated ${ts}</div>
      <button class="icon-btn" onclick="fetchData()">Refresh</button>
      <button class="icon-btn" onclick="openModal()">Settings</button>
    </div>`;

  startCountdowns();
}

// ---- Render Setup ----
function renderSetup() {
  app.innerHTML = `
    <div class="setup">
      <h2>GLM Quota Monitor</h2>
      <p>Enter your GLM Coding Plan API key to start monitoring.</p>
      <input id="setup-key" type="password" placeholder="Paste API key here" autofocus>
      <button onclick="submitKey()">Start</button>
      <div class="hint">
        Get your key from <a href="https://bigmodel.cn/usercenter/proj-mgmt/apikeys" target="_blank">bigmodel.cn</a>
      </div>
    </div>`;
  $('setup-key').addEventListener('keydown', e => { if(e.key==='Enter') submitKey(); });
}

// ---- Render Error ----
function renderError(msg) {
  error = msg;
  const el = $('err');
  if (el) { el.style.display = 'block'; el.textContent = msg; }
}

// ---- Data Fetching ----
async function fetchData() {
  try {
    const r = await fetch('/api/quota');
    if (!r.ok) {
      const e = await r.json();
      throw new Error(e.error || `HTTP ${r.status}`);
    }
    const d = await r.json();
    renderDash(d);
  } catch(e) {
    renderError(e.message);
  }
}

async function submitKey() {
  const key = $('setup-key').value.trim();
  if (!key) return;
  try {
    const r = await fetch('/api/config', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({api_key: key})
    });
    if (!r.ok) throw new Error('Save failed');
    startPolling();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ---- Settings Modal ----
function openModal() {
  $('set-interval').value = Math.round(refreshMs / 1000);
  $('set-key').value = '';
  $('modal').classList.add('show');
}
function closeModal() { $('modal').classList.remove('show'); }
async function saveSettings() {
  const key = $('set-key').value.trim();
  const iv = parseInt($('set-interval').value) || 30;
  const body = {};
  if (key) body.api_key = key;
  try {
    if (Object.keys(body).length) {
      await fetch('/api/config', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
    }
    refreshMs = Math.max(10, iv) * 1000;
    closeModal();
    restartPolling();
  } catch(e) { alert(e.message); }
}

// ---- Timers ----
function startCountdowns() {
  if (cdTimer) clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    document.querySelectorAll('[data-reset]').forEach(el => {
      const cd = el.querySelector('.cd-val');
      if (cd) cd.textContent = cdText(parseInt(el.dataset.reset));
    });
  }, 1000);
}

function startPolling() {
  fetchData();
  if (timer) clearInterval(timer);
  timer = setInterval(fetchData, refreshMs);
}
function restartPolling() {
  if (timer) clearInterval(timer);
  startPolling();
}

// ---- Init ----
(async function init() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    if (cfg.api_key_masked) {
      startPolling();
    } else {
      renderSetup();
    }
  } catch(e) {
    renderSetup();
  }
})();
</script>
</body>
</html>
